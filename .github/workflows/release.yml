name: Сборка и публикация релиза

# Запускается, когда в репозиторий приходит тег вида v1.6.1.
# Порядок работы: поднять версию в package.json, закоммитить, поставить тег,
# отправить тег — дальше всё делают серверы GitHub.
#
# Кнопка «Run workflow» на вкладке Actions запускает сборку вручную,
# без публикации: полезно проверить, что всё собирается.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Нужно, чтобы создать релиз и загрузить в него файлы.
permissions:
  contents: write

jobs:
  # Релиз создаётся заранее и отдельно от сборок.
  #
  # Иначе его создаёт сам electron-builder — и делает это при загрузке первого
  # же файла. Файлы он загружает параллельно, поэтому два из них успевают создать
  # релиз одновременно, и получается два релиза с одним тегом: часть файлов
  # в одном, часть в другом. Автообновление при этом молча ломается, потому что
  # манифест и установщик оказываются в разных релизах.
  prepare:
    name: Подготовить релиз
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Тег и версия в package.json должны совпадать.
      #
      # Когда они разошлись, сборка отчиталась об успехе, но релиз остался
      # пустым: файлы собрались под версию из package.json и уехали в релиз
      # с её номером, а релиз по имени тега так и остался без единого файла.
      # Автообновление при этом молча ломается у всех.
      - name: Сверить тег с версией в package.json
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Тег $TAG не совпадает с версией в package.json ($VERSION). Поднимите версию через npm version."
            exit 1
          fi
          echo "Тег и версия совпадают: $TAG"

      # Релиз создаётся черновиком и становится виден только в finalize, когда
      # все файлы на месте. Раньше он сразу становился «последним»: десять минут
      # сборки ссылки на скачивание вели в пустоту, а приложения, проверявшие
      # обновления в это время, не находили latest.yml.
      - name: Создать черновик релиза, если релиза ещё нет
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует, создавать не нужно"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --draft
            echo "Черновик релиза $TAG создан"
          fi

  # Сборки идут параллельно: черновик уже существует, создавать его им не придётся.
  macos:
    name: macOS (arm64)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверки
        run: npm test

      - name: Собрать и опубликовать
        run: npm run dist:mac -- --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подписи нет, и попытка её найти только ломает сборку.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  windows:
    name: Windows (x64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверки
        run: npm test

      - name: Собрать и опубликовать
        run: npm run dist:win -- --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Снятие черновика вынесено в отдельный шаг после обеих сборок.
  #
  # electron-builder держит релиз черновиком, пока заливает в него файлы, и
  # снимает черновик по завершении. Когда сборок две и идут они параллельно,
  # одна успевает вернуть черновой статус после того, как другая его сняла —
  # релиз остаётся невидимым снаружи, хотя все задачи зелёные.
  finalize:
    name: Опубликовать релиз
    needs: [macos, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Сначала проверить, что все файлы на месте, и только потом показать
      # релиз: неполный релиз так и остаётся черновиком.
      - name: Проверить содержимое и снять черновик
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          COUNT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [ "$COUNT" -lt 6 ]; then
            echo "::error::В релизе всего $COUNT файлов — ожидалось не меньше шести. Релиз оставлен черновиком."
            exit 1
          fi

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets \
            --jq '"черновик: \(.isDraft) | файлов: \(.assets | length)"'
